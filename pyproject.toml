[project]
name = "altissimo-shippo-tracking"
version = "0.2.1"
description = "Shippo shipping & tracking client with optional Firestore persistence."
authors = [{ name = "Lukas Karlsson", email = "karlsson@altissimo.io" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# pip install altissimo-shippo-tracking[firestore]
firestore = [
    # The Altissimo fork of firedantic, published as altissimo-firedantic
    # (import name is still `firedantic`).
    "altissimo-firedantic>=0.22.4,<0.23",
    "google-cloud-firestore>=2.0",
]

[project.urls]
Homepage = "https://github.com/altissimo-hq/shippo-tracking"
Repository = "https://github.com/altissimo-hq/shippo-tracking"
Issues = "https://github.com/altissimo-hq/shippo-tracking/issues"
Changelog = "https://github.com/altissimo-hq/shippo-tracking/blob/main/CHANGELOG.md"

[tool.poetry]
# Only Poetry-specific settings live here; package metadata is in [project].
packages = [{ include = "altissimo", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
fastapi = ">=0.100"
httpx = ">=0.24"
mypy = ">=1.15"
types-requests = ">=2.28"
pre-commit = "^4.6.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.16"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no infrastructure)",
    "integration: Integration tests (requires infrastructure)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"
]

[tool.ruff.lint.isort]
known-first-party = ["altissimo"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]

[tool.coverage.run]
source = ["altissimo"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["firedantic.*"]
ignore_missing_imports = true
